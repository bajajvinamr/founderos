services:
  founderos:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${FOUNDEROS_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      FOUNDEROS_HOME: "/founderos"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FOUNDEROS_DEPLOYMENT_MODE: "authenticated"
      FOUNDEROS_DEPLOYMENT_EXPOSURE: "private"
      FOUNDEROS_PUBLIC_URL: "${FOUNDEROS_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${FOUNDEROS_DATA_DIR:-../data/docker-founderos}:/founderos"
