# FounderOS — Fly.io deployment config
#
# Provisioning a new customer (automated via scripts/fly-provision.sh):
#   ./scripts/fly-provision.sh <slug> --db-url <postgres-url>
#   - Creates a Fly app named founderos-<slug>
#   - Attaches a 3gb persistent volume (founderos_data)
#   - Sets DATABASE_URL and FOUNDEROS_SECRETS_MASTER_KEY secrets
#   - Deploys the app
#
# Manual deployment (after provisioning):
#   fly deploy --app founderos-<slug>
#
# See: docs/deploy/self-host-fly.mdx for full walkthrough
# See: docs/deploy/fly-envs.md for environment variable reference

app = "founderos"
primary_region = "lhr"   # London — co-located with Fly Managed Postgres cluster
kill_signal = "SIGINT"
# S8 P0.1 Phase 1A — give in-flight `claude` subprocess jobs a graceful
# shutdown window. Hosted execution can have a wakeup mid-flight when the
# rolling deploy SIGINTs; 5s is too short for the adapter to checkpoint
# session state into /founderos/agents/<id>/state. 30s matches the
# longest typical claude-code wakeup tick + a safety margin.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  # Vite SPA needs VITE_* values at build time. The deploy-prod.yml workflow
  # passes them via `flyctl deploy --build-arg ...`. For manual deploys see
  # docs/runbooks/supabase-config.md — the deploy is a one-liner with the
  # required arg flags.
  #
  # Do NOT put VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY into [build.args]
  # below — that would commit values into the repo. They live in GitHub
  # secrets / your shell env / 1Password.

[deploy]
  strategy = "rolling"
  # Council 2026-05-04: migrations run via release_command on a single
  # ephemeral VM BEFORE any rolling-deploy machine boots. This eliminates
  # the "old container serves traffic against new schema during rollover"
  # window — the schema is at head before either old or new machines see
  # the new code path.
  #
  # ensureMigrations() in server/src/index.ts remains as a boot-time safety
  # net: idempotent (Drizzle's migrator no-ops when up-to-date), so it
  # adds ~50ms to cold-start without effect. Belt + suspenders.
  release_command = "node /app/packages/db/dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3100"
  HOST = "0.0.0.0"
  SERVE_UI = "true"
  FOUNDEROS_HOME = "/founderos"
  FOUNDEROS_INSTANCE_ID = "default"
  FOUNDEROS_DEPLOYMENT_MODE = "authenticated"
  FOUNDEROS_DEPLOYMENT_EXPOSURE = "public"
  FOUNDEROS_AUTH_PROVIDER = "supabase"
  FOUNDEROS_BYO_RUNNER_ENABLED = "1"
  # S8 P0.1 Phase 1A — keystone feature flag for the entire server-side
  # hosted-claude execution path. Default OFF; founder flips post-smoke
  # via `fly secrets set FOUNDEROS_HOSTED_AGENTS_ENABLED=1`. While "0",
  # adapter-resolver continues to route to claude_local / byo_runner.
  FOUNDEROS_HOSTED_AGENTS_ENABLED = "0"

# Persistent volume for /founderos — holds instance config, secrets key,
# workspace files, agent session state. Survives deploys + restarts.
[mounts]
  source = "founderos_data"
  destination = "/founderos"
  initial_size = "3gb"

[[services]]
  internal_port = 3100
  protocol = "tcp"
  processes = ["app"]
  # S8 P0.1 Phase 1A — `suspend` warm-snapshots the VM instead of cold-stopping.
  # Hosted claude execution requires a fast wakeup path; cold start tax is too
  # high. PR #140 also lands these two values; this branch matches them
  # exactly so the auto-merge rebase is conflict-free on these lines.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  # Liveness — cheap, every 5s. No DB call, just process health.
  [[services.http_checks]]
    interval = "5s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/api/healthz"
    protocol = "http"

  # Readiness — stricter, every 30s. Verifies DB + auth bootstrap.
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/readyz"
    protocol = "http"

[[vm]]
  # S8 P0.1 Phase 1A — bumped from shared-cpu-1x/1gb/1cpu to support hosted
  # `claude` subprocesses. One concurrent agent run holds ~600MB resident
  # (claude-code CLI + node + agent state); 1gb left no headroom for the
  # server itself. 2gb + 2 vCPU lets us run 2 concurrent agent jobs while
  # the API stays responsive. Cost: warm shared-cpu-2x in lhr ≈ $15.55/mo
  # (~$0.0000086/s × 2592000s + small RAM premium for 2gb vs 1gb).
  size = "shared-cpu-2x"
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
