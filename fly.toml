# FounderOS — Fly.io deployment config
#
# Provisioning a new customer (automated via scripts/fly-provision.sh):
#   ./scripts/fly-provision.sh <slug> --db-url <postgres-url>
#   - Creates a Fly app named founderos-<slug>
#   - Attaches a 3gb persistent volume (founderos_data)
#   - Sets DATABASE_URL and FOUNDEROS_SECRETS_MASTER_KEY secrets
#   - Deploys the app
#
# Manual deployment (after provisioning):
#   fly deploy --app founderos-<slug>
#
# See: docs/deploy/self-host-fly.mdx for full walkthrough
# See: docs/deploy/fly-envs.md for environment variable reference

app = "founderos"
primary_region = "bom"   # Mumbai — closest to Supabase primary if you're using Mumbai region
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  # Migrations run automatically on boot via ensureMigrations() in server/src/index.ts

[env]
  NODE_ENV = "production"
  PORT = "3100"
  HOST = "0.0.0.0"
  SERVE_UI = "true"
  FOUNDEROS_HOME = "/founderos"
  FOUNDEROS_INSTANCE_ID = "default"
  FOUNDEROS_DEPLOYMENT_MODE = "authenticated"
  FOUNDEROS_DEPLOYMENT_EXPOSURE = "private"

# Persistent volume for /founderos — holds instance config, secrets key,
# workspace files, agent session state. Survives deploys + restarts.
[mounts]
  source = "founderos_data"
  destination = "/founderos"
  initial_size = "3gb"

[[services]]
  internal_port = 3100
  protocol = "tcp"
  processes = ["app"]
  auto_stop_machines = "stop"     # Scale to zero when idle (single-tenant friendly)
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  # Liveness — cheap, every 5s. No DB call, just process health.
  [[services.http_checks]]
    interval = "5s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/api/healthz"
    protocol = "http"

  # Readiness — stricter, every 30s. Verifies DB + auth bootstrap.
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/readyz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
