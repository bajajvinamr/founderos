name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Skip smoke tests (emergency — do not use unless you know what you're doing)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Only one production deploy at a time. If a new commit lands mid-deploy,
# the in-flight one finishes first and the newer one runs right after
# (no cancel — we don't want to half-deploy then abandon).
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write
  statuses: write

env:
  FLY_APP: founderos
  FLY_URL: https://founderos.fly.dev
  VERCEL_URL: https://founderos-bice.vercel.app
  # Hardcoded from .vercel/project.json — these are not secrets.
  VERCEL_ORG_ID: team_u2B2mxbkSdhU9d5bqdM1EmNA
  VERCEL_PROJECT_ID: prj_D8tbUPZIdJBkSIc2Adz1f8yqcn77

jobs:
  # ─── 1. Preflight: typecheck + tests. Fail fast. ─────────────────────
  preflight:
    name: Preflight (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        timeout-minutes: 10
        run: pnpm -r typecheck

      - name: Tests
        timeout-minutes: 15
        run: pnpm test:run

  # ─── 2. Deploy Fly backend ───────────────────────────────────────────
  deploy-fly:
    name: Deploy Fly backend
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.deploy.outputs.image_digest }}
      fly_version: ${{ steps.deploy.outputs.fly_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Record pre-deploy release (for rollback)
        id: pre
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          prev="$(flyctl releases list --app "$FLY_APP" --json | python3 -c 'import json,sys;r=json.load(sys.stdin);print(r[0]["Version"] if r else "")' || echo "")"
          echo "previous_version=${prev}" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy release version: ${prev}"

      - name: Deploy to Fly
        id: deploy
        timeout-minutes: 15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --app "$FLY_APP" --ha=false --remote-only
          digest="$(flyctl image show --app "$FLY_APP" --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0].get("Digest","") if isinstance(d,list) else d.get("Digest",""))' || echo "")"
          version="$(flyctl releases list --app "$FLY_APP" --json | python3 -c 'import json,sys;r=json.load(sys.stdin);print(r[0]["Version"] if r else "")' || echo "")"
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "fly_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Deployed image digest: ${digest}"
          echo "Fly release version: ${version}"

      - name: Save previous version for rollback
        run: echo "${{ steps.pre.outputs.previous_version }}" > /tmp/fly-previous-version
      - uses: actions/upload-artifact@v4
        with:
          name: fly-previous-version
          path: /tmp/fly-previous-version
          retention-days: 7

  # ─── 3. Deploy Vercel frontend ───────────────────────────────────────
  deploy-vercel:
    name: Deploy Vercel frontend
    needs: deploy-fly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Deploy to Vercel
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest --prod --yes --token="$VERCEL_TOKEN"

  # ─── 4. Smoke tests ──────────────────────────────────────────────────
  smoke:
    name: Smoke (post-deploy)
    needs: [deploy-fly, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: ${{ github.event.inputs.skip_smoke != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke harness
        id: run
        timeout-minutes: 5
        run: |
          chmod +x scripts/ci/smoke.sh
          set +e
          scripts/ci/smoke.sh \
            --url "$FLY_URL/api/healthz" \
            --url "$VERCEL_URL/" \
            --url "$VERCEL_URL/api/healthz" \
            --retries 3 --initial-delay 2 --timeout 30 \
            --json "$RUNNER_TEMP/smoke-results.json"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run deep health check
        id: deep
        timeout-minutes: 2
        run: |
          set +e
          response="$(curl -sS -m 10 "$FLY_URL/api/health/deep")"
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo "deep_health=fail" >> "$GITHUB_OUTPUT"
            echo "deep_response=curl failed with rc=$rc" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Check if response contains "ok" status
          status="$(echo "$response" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("status","unknown"))' 2>/dev/null || echo "unknown")"

          if [[ "$status" == "ok" ]]; then
            echo "deep_health=pass" >> "$GITHUB_OUTPUT"
            echo "deep_response=$response" >> "$GITHUB_OUTPUT"
          else
            echo "deep_health=fail" >> "$GITHUB_OUTPUT"
            echo "deep_response=$response" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: ${{ runner.temp }}/smoke-results.json
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-health-response
          path: /tmp/deep-health-response.json
          retention-days: 14

  # ─── 5. Rollback on smoke or deep health failure ────────────────────
  rollback-on-fail:
    name: Rollback Fly (smoke or deep health failed)
    needs: [deploy-fly, smoke]
    if: ${{ failure() && (needs.smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rolled_back: ${{ steps.rollback.outputs.rolled_back }}
      rollback_target: ${{ steps.rollback.outputs.target_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: actions/download-artifact@v4
        with:
          name: fly-previous-version
          path: /tmp/fly-previous

      - name: List current releases (audit)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases list --app "$FLY_APP"

      - name: Roll back Fly to previous release
        id: rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          target="$(cat /tmp/fly-previous/fly-previous-version || true)"
          if [[ -z "$target" ]]; then
            echo "No previous version recorded — running bare 'flyctl releases rollback' (picks the one before latest)"
            flyctl releases rollback --app "$FLY_APP" --yes
          else
            echo "Rolling back to version $target"
            flyctl releases rollback "$target" --app "$FLY_APP" --yes
          fi
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          echo "target_version=${target:-prev}" >> "$GITHUB_OUTPUT"

      - name: Verify rollback is healthy
        timeout-minutes: 5
        run: |
          chmod +x scripts/ci/rollback-verify.sh scripts/ci/smoke.sh
          scripts/ci/rollback-verify.sh \
            --url "$FLY_URL/api/healthz" \
            --url "$VERCEL_URL/" \
            --url "$VERCEL_URL/api/healthz"

      - name: Post GitHub deployment status (rollback)
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   sha,
              environment: 'production',
              description: 'Rollback after smoke failure',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              deployment_id: deployment.id,
              state: 'failure',
              description: 'Smoke failed — rolled back Fly to previous release',
              environment: 'production',
            });

  # ─── 6. Notify: always runs last ─────────────────────────────────────
  notify:
    name: Notify
    needs: [preflight, deploy-fly, deploy-vercel, smoke, rollback-on-fail]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute outcome
        id: outcome
        run: |
          smoke="${{ needs.smoke.result }}"
          rb="${{ needs.rollback-on-fail.result }}"
          pre="${{ needs.preflight.result }}"
          fly="${{ needs.deploy-fly.result }}"
          ver="${{ needs.deploy-vercel.result }}"

          if [[ "$smoke" == "success" ]]; then
            outcome="success"
            emoji=":white_check_mark:"
          elif [[ "$rb" == "success" ]]; then
            outcome="rolled-back"
            emoji=":rotating_light:"
          else
            outcome="failed"
            emoji=":x:"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "emoji=$emoji"     >> "$GITHUB_OUTPUT"
          echo "summary=preflight=$pre fly=$fly vercel=$ver smoke=$smoke rollback=$rb" >> "$GITHUB_OUTPUT"

      - name: Post GitHub deployment status (success path)
        if: needs.smoke.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   context.sha,
              environment: 'production',
              description: 'Deploy + smoke succeeded',
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              description: 'Healthy in production',
              environment_url: 'https://founderos-bice.vercel.app',
              environment: 'production',
            });

      - name: Slack notification (optional)
        # Guard with a conditional that checks the secret is non-empty. Secrets
        # aren't directly usable in `if:` contexts, so we gate on env inside the
        # run block below (the job-level env is populated from the secret).
        env:
          SLACK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          EMOJI: ${{ steps.outcome.outputs.emoji }}
          SUMMARY: ${{ steps.outcome.outputs.summary }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ROLLED_BACK: ${{ needs.rollback-on-fail.result == 'success' }}
        run: |
          if [[ -z "${SLACK_URL:-}" ]]; then
            echo "SLACK_DEPLOY_WEBHOOK_URL not set — skipping Slack notify"
            exit 0
          fi
          short_sha="${SHA:0:7}"
          run_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          export TEXT="${EMOJI} Prod deploy *${OUTCOME}* — \`${short_sha}\` by @${ACTOR}"$'\n'"${SUMMARY}"$'\n'"rollback_taken=${ROLLED_BACK}"$'\n'"<${run_url}|View run>"
          payload=$(python3 -c 'import json,os;print(json.dumps({"text":os.environ["TEXT"]}))')
          curl -sS -X POST -H 'content-type: application/json' --data "$payload" "$SLACK_URL" || true
