name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Skip smoke tests (emergency — do not use unless you know what you're doing)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Only one production deploy at a time. If a new commit lands mid-deploy,
# the in-flight one finishes first and the newer one runs right after
# (no cancel — we don't want to half-deploy then abandon).
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write
  statuses: write

env:
  FLY_APP: founderos
  FLY_URL: https://founderos.fly.dev
  # Vercel deploy was removed 2026-05-07: the legacy Vercel host is now a
  # static 301 redirect (vercel.json) frozen at the architecture cutover. No
  # SPA content is served from Vercel — Fly serves both API and UI on a
  # single origin. If the redirect target ever needs to change, run
  # `npx vercel deploy --prod` manually; auto-deploy on every commit was
  # dead weight and was failing CI when VERCEL_TOKEN wasn't set as a
  # GitHub secret. See CLAUDE.md "Single-origin from 2026-05-03 onward".

jobs:
  # ─── 1. Preflight: typecheck + tests. Fail fast. ─────────────────────
  preflight:
    name: Preflight (typecheck + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        timeout-minutes: 10
        run: pnpm -r typecheck

      - name: Tests
        timeout-minutes: 15
        run: pnpm test:run

  # ─── 2. Deploy Fly backend ───────────────────────────────────────────
  deploy-fly:
    name: Deploy Fly backend
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.deploy.outputs.image_digest }}
      fly_version: ${{ steps.deploy.outputs.fly_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Record pre-deploy release (for rollback)
        id: pre
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          prev="$(flyctl releases list --app "$FLY_APP" --json | python3 -c 'import json,sys;r=json.load(sys.stdin);print(r[0]["Version"] if r else "")' || echo "")"
          echo "previous_version=${prev}" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy release version: ${prev}"

      - name: Deploy to Fly
        id: deploy
        timeout-minutes: 15
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # VITE_* values are baked into the SPA bundle at build time. They
          # are NOT secrets in the Fly-secrets sense — the anon key is safe
          # to ship in a public client per Supabase RLS design — but we still
          # source them from GitHub Secrets so they don't litter the repo.
          # If either is missing, the vite build-time guard hard-fails with
          # an explicit error message (see ui/vite.config.ts).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY missing in GitHub secrets — refusing to deploy a broken bundle"
            exit 1
          fi
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flyctl deploy --app "$FLY_APP" --ha=false --remote-only \
            --build-arg "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
            --build-arg "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" \
            --build-arg "VITE_SENTRY_DSN=${VITE_SENTRY_DSN}" \
            --build-arg "VITE_BUILD_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "VITE_BUILD_TIME=${BUILD_TIME}"
          digest="$(flyctl image show --app "$FLY_APP" --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0].get("Digest","") if isinstance(d,list) else d.get("Digest",""))' || echo "")"
          version="$(flyctl releases list --app "$FLY_APP" --json | python3 -c 'import json,sys;r=json.load(sys.stdin);print(r[0]["Version"] if r else "")' || echo "")"
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "fly_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Deployed image digest: ${digest}"
          echo "Fly release version: ${version}"

      - name: Save previous version for rollback
        run: echo "${{ steps.pre.outputs.previous_version }}" > /tmp/fly-previous-version
      - uses: actions/upload-artifact@v4
        with:
          name: fly-previous-version
          path: /tmp/fly-previous-version
          retention-days: 7

  # ─── 3. Smoke tests ──────────────────────────────────────────────────
  smoke:
    name: Smoke (post-deploy)
    needs: [deploy-fly]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: ${{ github.event.inputs.skip_smoke != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke harness
        id: run
        timeout-minutes: 5
        run: |
          chmod +x scripts/ci/smoke.sh
          set +e
          scripts/ci/smoke.sh \
            --url "$FLY_URL/api/healthz" \
            --retries 3 --initial-delay 2 --timeout 30 \
            --json "$RUNNER_TEMP/smoke-results.json"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify SPA bundle has no placeholder.supabase.co
        id: bundle-check
        timeout-minutes: 2
        run: |
          # Catches the 2026-05-04 incident class: deployed bundle that still
          # contains the literal placeholder Supabase URL because VITE_* build
          # args weren't passed. Fail the deploy (and trigger rollback) if any
          # JS asset on the live origin contains the sentinel string.
          set +e
          chmod +x scripts/ci/check-deployed-supabase.sh
          scripts/ci/check-deployed-supabase.sh "$FLY_URL"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Deployed bundle contains placeholder.supabase.co — auth WILL be broken in prod"
            exit 1
          fi

      # Readiness probe (replaces /api/health/deep as of council #133, 2026-05-05).
      # /api/health/deep was switched to require instance-admin auth in the
      # 2026-05-03 council — an unauthenticated curl from CI returns 401/403
      # and would auto-rollback every prod deploy. /api/readyz is the
      # canonical public deploy gate: 200 "ready" if DB reachable + auth
      # bootstrapped (authenticated mode), 503 otherwise. Sufficient for
      # deploy gating; the richer /api/health/deep payload is for oncall
      # dashboards (admin-gated, viewed manually).
      - name: Run readiness probe
        id: ready
        timeout-minutes: 2
        run: |
          set +e
          # -w "\n%{http_code}" appends the HTTP status code on a new line
          # so we can split body from code without parsing JSON.
          response="$(curl -sS -m 10 -w "\n%{http_code}" "$FLY_URL/api/readyz")"
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo "ready_health=fail" >> "$GITHUB_OUTPUT"
            echo "ready_response=curl failed with rc=$rc" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          http_code="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          if [[ "$http_code" == "200" ]] && [[ "$body" == "ready" ]]; then
            echo "ready_health=pass" >> "$GITHUB_OUTPUT"
            echo "ready_response=$body (http $http_code)" >> "$GITHUB_OUTPUT"
          else
            echo "ready_health=fail" >> "$GITHUB_OUTPUT"
            echo "ready_response=$body (http $http_code)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: ${{ runner.temp }}/smoke-results.json
          retention-days: 14

  # ─── 4b. Post-deploy auth canary trigger ─────────────────────────────
  # Fire a repository_dispatch event so e2e-synthetic.yml runs the auth
  # round-trip canary (sign-in → /api/companies → board) within ~30s of
  # the new release going live. POST-traffic, deliberately — pre-traffic
  # gating is /api/readyz only, per council #133. If the canary fails,
  # the incident issue + Slack page fires from e2e-synthetic.yml; we do
  # NOT block the deploy on it (already live). The canary is a "is auth
  # still alive after the release" detector, not a gate.
  trigger-auth-canary:
    name: Trigger auth canary (post-deploy)
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && github.event.inputs.skip_smoke != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch auth-canary-trigger
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              event_type: "auth-canary-trigger",
              client_payload: {
                trigger: "deploy-prod",
                sha: context.sha,
                run_id: context.runId.toString(),
              },
            });
            core.info("Fired auth-canary-trigger repository_dispatch — e2e-synthetic.yml will run the auth round-trip against prod.");

  # ─── 5. Rollback on smoke or readiness probe failure ────────────────
  # /api/readyz replaced /api/health/deep as the deploy gate on 2026-05-05
  # (council #133) — deep is now admin-gated and a public CI curl returns
  # 401/403, which would auto-rollback every deploy.
  rollback-on-fail:
    name: Rollback Fly (smoke or readiness probe failed)
    needs: [deploy-fly, smoke]
    if: ${{ failure() && (needs.smoke.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rolled_back: ${{ steps.rollback.outputs.rolled_back }}
      rollback_target: ${{ steps.rollback.outputs.target_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: actions/download-artifact@v4
        with:
          name: fly-previous-version
          path: /tmp/fly-previous

      - name: List current releases (audit)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases list --app "$FLY_APP"

      - name: Roll back Fly to previous release
        id: rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          target="$(cat /tmp/fly-previous/fly-previous-version || true)"
          if [[ -z "$target" ]]; then
            echo "No previous version recorded — running bare 'flyctl releases rollback' (picks the one before latest)"
            flyctl releases rollback --app "$FLY_APP" --yes
          else
            echo "Rolling back to version $target"
            flyctl releases rollback "$target" --app "$FLY_APP" --yes
          fi
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          echo "target_version=${target:-prev}" >> "$GITHUB_OUTPUT"

      - name: Verify rollback is healthy
        timeout-minutes: 5
        run: |
          chmod +x scripts/ci/rollback-verify.sh scripts/ci/smoke.sh
          scripts/ci/rollback-verify.sh \
            --url "$FLY_URL/api/healthz"

      - name: Post GitHub deployment status (rollback)
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   sha,
              environment: 'production',
              description: 'Rollback after smoke failure',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              deployment_id: deployment.id,
              state: 'failure',
              description: 'Smoke failed — rolled back Fly to previous release',
              environment: 'production',
            });

  # ─── 6. Notify: always runs last ─────────────────────────────────────
  notify:
    name: Notify
    needs: [preflight, deploy-fly, smoke, rollback-on-fail]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compute outcome
        id: outcome
        run: |
          smoke="${{ needs.smoke.result }}"
          rb="${{ needs.rollback-on-fail.result }}"
          pre="${{ needs.preflight.result }}"
          fly="${{ needs.deploy-fly.result }}"

          if [[ "$smoke" == "success" ]]; then
            outcome="success"
            emoji=":white_check_mark:"
          elif [[ "$rb" == "success" ]]; then
            outcome="rolled-back"
            emoji=":rotating_light:"
          else
            outcome="failed"
            emoji=":x:"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "emoji=$emoji"     >> "$GITHUB_OUTPUT"
          echo "summary=preflight=$pre fly=$fly smoke=$smoke rollback=$rb" >> "$GITHUB_OUTPUT"

      - name: Post GitHub deployment status (success path)
        if: needs.smoke.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   context.sha,
              environment: 'production',
              description: 'Deploy + smoke succeeded',
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              description: 'Healthy in production',
              environment_url: 'https://founderos.fly.dev',
              environment: 'production',
            });

      - name: Slack notification (optional)
        # Guard with a conditional that checks the secret is non-empty. Secrets
        # aren't directly usable in `if:` contexts, so we gate on env inside the
        # run block below (the job-level env is populated from the secret).
        env:
          SLACK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          EMOJI: ${{ steps.outcome.outputs.emoji }}
          SUMMARY: ${{ steps.outcome.outputs.summary }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ROLLED_BACK: ${{ needs.rollback-on-fail.result == 'success' }}
        run: |
          if [[ -z "${SLACK_URL:-}" ]]; then
            echo "SLACK_DEPLOY_WEBHOOK_URL not set — skipping Slack notify"
            exit 0
          fi
          short_sha="${SHA:0:7}"
          run_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          export TEXT="${EMOJI} Prod deploy *${OUTCOME}* — \`${short_sha}\` by @${ACTOR}"$'\n'"${SUMMARY}"$'\n'"rollback_taken=${ROLLED_BACK}"$'\n'"<${run_url}|View run>"
          payload=$(python3 -c 'import json,os;print(json.dumps({"text":os.environ["TEXT"]}))')
          curl -sS -X POST -H 'content-type: application/json' --data "$payload" "$SLACK_URL" || true
