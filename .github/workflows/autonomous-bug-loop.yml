name: Autonomous Bug Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "standard or heavy"
        required: false
        default: "standard"
        type: choice
        options:
          - standard
          - heavy
  schedule:
    # Daily safety scan. Keep this bounded; local long-running loops use scripts/autonomous-bug-loop.mjs.
    - cron: "17 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: autonomous-bug-loop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.4"
  AUTONOMOUS_LOOP_MODE: ${{ inputs.mode || 'standard' }}

jobs:
  bug-loop:
    name: autonomous bug loop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run autonomous bug loop iteration
        run: |
          if [ "$AUTONOMOUS_LOOP_MODE" = "heavy" ]; then
            node scripts/autonomous-bug-loop.mjs --max-iterations=1 --mode=heavy --heavy --report-only
          else
            node scripts/autonomous-bug-loop.mjs --max-iterations=1 --mode=standard --report-only
          fi

      - name: Publish summary
        if: always()
        run: |
          if [ -f .autonomous-loop/reports/latest.md ]; then
            cat .autonomous-loop/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No autonomous-loop report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-bug-loop-report
          path: .autonomous-loop/reports/
          if-no-files-found: warn
          retention-days: 30
