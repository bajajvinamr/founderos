name: E2E CI (critical flows)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch: {}

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E — critical flows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    env:
      # The suite targets whatever base URL we feed it — CI always runs the
      # local server we boot below.
      FOUNDEROS_E2E_BASE_URL: http://localhost:3100
      FOUNDEROS_E2E_PROFILE: default
      # local_trusted means no auth required for API calls — exactly what
      # the suite needs to hit `/api/companies/:id/…` without a session.
      FOUNDEROS_DEPLOYMENT_MODE: local_trusted
      PORT: "3100"
      # Embedded PG connection string. Matches what seed-demo.ts expects when
      # no external DB is configured.
      DATABASE_URL: postgres://founderos:founderos@127.0.0.1:54329/founderos

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace
        run: pnpm build

      # The server ships an embedded Postgres; `pnpm dev` spawns it on boot.
      # We therefore skip docker-compose for the DB and rely on embedded PG.
      # If the repo grows a compose file we can switch here without touching
      # the spec suite.
      - name: Seed demo data
        run: pnpm seed:demo
        continue-on-error: false

      - name: Boot server
        run: |
          pnpm dev:server &
          echo $! > /tmp/founderos-server.pid
        shell: bash

      - name: Wait for /api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:3100/api/health" >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready" >&2
          exit 1

      - name: Boot UI (vite dev)
        run: |
          pnpm dev:ui &
          echo $! > /tmp/founderos-ui.pid
        shell: bash

      - name: Wait for UI port
        run: |
          set -euo pipefail
          UI_PORT="${VITE_PORT:-5173}"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${UI_PORT}/" >/dev/null 2>&1; then
              echo "ui ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ui never became ready" >&2
          # Not a hard fail — some specs hit the server directly, and the
          # server proxies the UI in production builds anyway.
          exit 0

      - name: Run critical-flow E2E
        run: pnpm e2e

      - name: Stop background processes
        if: always()
        run: |
          for f in /tmp/founderos-server.pid /tmp/founderos-ui.pid; do
            if [[ -f "$f" ]]; then
              kill "$(cat "$f")" 2>/dev/null || true
            fi
          done
        shell: bash

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
