name: E2E CI (critical flows)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch: {}

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E — critical flows
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      # The suite targets whatever base URL we feed it — CI always runs the
      # local server we boot below.
      FOUNDEROS_E2E_BASE_URL: http://localhost:3100
      FOUNDEROS_E2E_PROFILE: default
      # local_trusted means no auth required for API calls — exactly what
      # the suite needs to hit `/api/companies/:id/…` without a session.
      FOUNDEROS_DEPLOYMENT_MODE: local_trusted
      PORT: "3100"
      # NOTE: DATABASE_URL is intentionally NOT set at workflow level. The
      # server uses an embedded Postgres only when DATABASE_URL is empty
      # (server/src/index.ts:274). Setting DATABASE_URL globally would push
      # the server into external-postgres mode and skip embedded boot,
      # leaving nothing on 54329 for seed-demo to connect to. We scope
      # DATABASE_URL to just the seed step below, where the server's
      # embedded PG is already running on that port.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        # Retry the apt-mediated `--with-deps` install — GitHub Actions
        # runners occasionally hit transient DNS resolution failures
        # against `azure.archive.ubuntu.com`, which fails the install
        # outright. Retrying twice covers the common transient case.
        run: |
          set -e
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              echo "playwright install ok on attempt ${attempt}"
              exit 0
            fi
            echo "playwright install attempt ${attempt} failed; retrying..." >&2
            sleep 10
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1
        shell: bash

      - name: Build workspace
        # The onboarding-v2 spec asserts the FounderOnboardingWizard
        # (6-step) flow renders at /onboarding. App.tsx defaults the
        # FOUNDEROS_ONBOARDING_V2 flag from `import.meta.env.DEV`,
        # which is `false` in any production build — so without this
        # explicit Vite-time flag the built UI ships the legacy wizard
        # and the spec fails. Setting it here keeps the test as a real
        # signal of the V2 flow without requiring a separate dev build.
        # VITE_SUPABASE_* required by ui/vite.config.ts strict guard.
        env:
          VITE_FOUNDEROS_ONBOARDING_V2: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      # Boot the server FIRST so its embedded Postgres comes up on
      # 54329 before anything tries to connect. Migrations auto-apply
      # (TTY heuristic in server/src/index.ts:116; the env var is
      # belt-and-suspenders).
      - name: Boot server (starts embedded Postgres on 54329)
        env:
          FOUNDEROS_MIGRATION_AUTO_APPLY: "true"
        run: |
          pnpm dev:server &
          echo $! > /tmp/founderos-server.pid
        shell: bash

      - name: Wait for /api/health (proves embedded Postgres is up)
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS "http://localhost:3100/api/health" >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready" >&2
          if [[ -f /tmp/founderos-server.pid ]]; then
            echo "----- last 200 lines of server stdout/stderr (if captured) -----"
            jobs -l || true
          fi
          exit 1

      # Now embedded Postgres on 54329 is reachable. Seed against it via
      # DATABASE_URL — scoped to this step only.
      - name: Seed demo data
        env:
          DATABASE_URL: postgres://founderos:founderos@127.0.0.1:54329/founderos
          # P0 audit finding #5 (2026-05-09): seed-demo* scripts refuse to run
          # without this gate. CI is pointed at the embedded PG above (port
          # 54329, NOT prod), so confirming the gate is correct here.
          FOUNDEROS_SEED_DEMO: "1"
        run: pnpm seed:demo
        continue-on-error: false

      - name: Boot UI (vite dev)
        run: |
          pnpm dev:ui &
          echo $! > /tmp/founderos-ui.pid
        shell: bash

      - name: Wait for UI port
        run: |
          set -euo pipefail
          UI_PORT="${VITE_PORT:-5173}"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${UI_PORT}/" >/dev/null 2>&1; then
              echo "ui ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ui never became ready" >&2
          # Not a hard fail — some specs hit the server directly, and the
          # server proxies the UI in production builds anyway.
          exit 0

      - name: Run critical-flow E2E
        run: pnpm e2e

      - name: Stop background processes
        if: always()
        run: |
          for f in /tmp/founderos-server.pid /tmp/founderos-ui.pid; do
            if [[ -f "$f" ]]; then
              kill "$(cat "$f")" 2>/dev/null || true
            fi
          done
        shell: bash

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
