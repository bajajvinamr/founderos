name: Wave 22D Release Automation

on:
  push:
    branches:
      - main

concurrency:
  group: release-wave-22d
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute next version
        id: version
        run: |
          npx tsx scripts/ci/bump-version.ts > /tmp/version-out.txt 2>&1
          cat /tmp/version-out.txt
          VERSION=$(grep "Bumped\|Version:" /tmp/version-out.txt | tail -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1 || echo "no-bump")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        if: steps.version.outputs.version != 'no-bump'
        run: |
          npx tsx scripts/ci/bump-version.ts

      - name: Create git tag
        if: steps.version.outputs.version != 'no-bump'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tag = `v${version}`;

            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });

            console.log(`Created tag: ${tag}`);

      - name: Generate CHANGELOG entry
        if: steps.version.outputs.version != 'no-bump'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Build changelog section
          {
            echo "## [$VERSION] - $TIMESTAMP"
            echo ""

            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log --format="- %s (%h)" "$LAST_TAG"..HEAD)
            else
              COMMITS=$(git log --format="- %s (%h)")
            fi

            if echo "$COMMITS" | grep -q "^- feat"; then
              echo "### Added"
              echo "$COMMITS" | grep "^- feat" || true
              echo ""
            fi

            if echo "$COMMITS" | grep -q "^- fix"; then
              echo "### Fixed"
              echo "$COMMITS" | grep "^- fix" || true
              echo ""
            fi

            if echo "$COMMITS" | grep -qE "^- (perf|refactor)"; then
              echo "### Changed"
              echo "$COMMITS" | grep -E "^- (perf|refactor)" || true
              echo ""
            fi
          } > /tmp/changelog-new.txt

          # Prepend to existing CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md >> /tmp/changelog-new.txt
          else
            echo "## [Unreleased]" >> /tmp/changelog-new.txt
          fi

          cp /tmp/changelog-new.txt CHANGELOG.md

      - name: Commit CHANGELOG and package.json
        if: steps.version.outputs.version != 'no-bump'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]" || echo "Nothing to commit"

      - name: Push commits and tags
        if: steps.version.outputs.version != 'no-bump'
        run: |
          git push origin main
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        if: steps.version.outputs.version != 'no-bump'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tag = `v${version}`;
            const fs = require('fs');

            // Read the CHANGELOG
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const lines = changelog.split('\n');
            let body = '';
            let inSection = false;

            for (const line of lines) {
              if (line.startsWith('##') && inSection) break;
              if (line.startsWith(`## [${version}]`)) {
                inSection = true;
                continue;
              }
              if (inSection) body += line + '\n';
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${tag}`,
              body: body.trim() || `Release ${tag}`,
              draft: false,
              prerelease: false
            });

            console.log(`Created GitHub Release: ${tag}`);

      - name: Upload Sentry release marker
        if: steps.version.outputs.version != 'no-bump' && env.SENTRY_AUTH_TOKEN
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'founderos' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'founderos-web' }}
        with:
          environment: production
          version: ${{ steps.version.outputs.version }}
          sourcemaps: "ui/dist/"
          url_prefix: "~/static/"
          finalize: true
